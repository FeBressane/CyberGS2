name: DAST - OWASP ZAP

on:
  workflow_dispatch:   # você roda manualmente pelo botão "Run workflow"
  # opcional: agendar
  # schedule:
  #   - cron: "0 3 * * 1"

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: ZAP Baseline Scan em app de demonstração
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true       # não "quebra" o pipeline se achar problemas
        with:
          # alvo público de teste (demonstrar o DAST)
          target: "https://demo.testfire.net"
          # -a = modo "agressivo" de varredura
          # -I = ignora falhas de aviso para não falhar tão fácil
          cmd_options: "-a -I"
